name: Website integrity

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - "scripts/check_site.py"
      - ".github/workflows/site-integrity.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "assets/**"
      - "scripts/check_site.py"
      - ".github/workflows/site-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    name: Verify HTML pages, assets, and internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate static site
        run: python scripts/check_site.py
